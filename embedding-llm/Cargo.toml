[package]
name = "embedding-llm"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
description = "LLM-based embedding generation plugin"
repository = { workspace = true }
license = { workspace = true }

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
jobworkerp-plugin-abi = { workspace = true }
jobworkerp-plugin-abi-macros = { workspace = true }
jobworkerp-llama-protobuf = { path = "../llama-protobuf" }
mtmd-support = { path = "../mtmd-support" }
proto = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
command-utils = { path = "../modules/command-utils" }
dotenvy = { workspace = true }
encoding_rs = { workspace = true }
hf-hub-utils = { workspace = true }
itertools = { workspace = true }
# Pulls in vendored OpenSSL (configured in workspace) so the produced .so
# does not depend on the host's libssl/libcrypto.
openssl = { workspace = true }
llama-cpp-2 = { workspace = true }
llama-cpp-sys-2 = { workspace = true }
once_cell = { workspace = true }
opentelemetry = { workspace = true}
prost = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tokenizers = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }

[features]
default = []
metal = ["llama-cpp-2/metal"]
cuda = ["llama-cpp-2/cuda"]
rocm = ["llama-cpp-2/rocm"]
# No-op kept for backward compatibility. llama.cpp CPU optimizations follow
# rustc's target CPU (e.g. RUSTFLAGS=-Ctarget-cpu=x86-64-v3): llama-cpp-sys-2
# maps it to GGML_NATIVE / GGML_AVX*, and the default x86_64 target has no AVX.
native = []
dynamic-link = ["llama-cpp-2/dynamic-link"]
openmp = ["llama-cpp-2/openmp"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync"] }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
